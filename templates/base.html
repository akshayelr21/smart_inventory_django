<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Smart Inventory{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{% load static %}{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
{% if request.user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container-fluid">
<a class="navbar-brand" href="{% url 'dashboard' %}">Smart Inventory</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'products' %}">Products</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'inventory' %}">Inventory</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'customers' %}">Customers</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'orders' %}">Orders</a></li>
<li class="nav-item"><a class="nav-link" href="{% url 'reports' %}">Reports</a></li>
</ul>
<span class="navbar-text text-white me-3">{{ request.user.username }}</span>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Logout</button></form>
</div></div></nav>
{% endif %}
<main class="container py-4">
{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}
{% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
