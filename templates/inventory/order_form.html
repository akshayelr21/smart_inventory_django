{% extends "base.html" %}

{% block content %}
<div class="card form-card">
    <div class="card-body p-4">
        <h2>Create Order</h2>

        {% if not customers %}
            <div class="alert alert-warning">
                Add a customer before creating an order.
            </div>
        {% endif %}

        {% if not products %}
            <div class="alert alert-warning">
                Add a product before creating an order.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label" for="customer">Customer</label>
                <select class="form-select" id="customer" name="customer" required>
                    {% for c in customers %}
                        <option value="{{ c.pk }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label" for="product">Product</label>
                <select class="form-select" id="product" name="product" required>
                    {% for p in products %}
                        <option value="{{ p.pk }}">
                            {{ p.name }} — ₹{{ p.price }} ({{ p.quantity }} available)
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label" for="quantity">Quantity</label>
                <input
                    class="form-control"
                    id="quantity"
                    type="number"
                    min="1"
                    name="quantity"
                    required
                >
            </div>

            <button
                class="btn btn-primary"
                type="submit"
                {% if not customers or not products %}disabled{% endif %}
            >
                Create Order
            </button>

            <a class="btn btn-secondary" href="{% url 'orders' %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
