{% extends "base.html" %}{% block content %}<div class="card shadow-sm form-card">
    <div class="card-body p-4">
        <h2>{{ title }}</h2>
        <form method="post">{% csrf_token %}
            {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{%
                for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
            <button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary"
                href="javascript:history.back()">Cancel</a>
        </form>
    </div>
</div>{% endblock %}
